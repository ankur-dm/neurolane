# Registry for the brain. Add kinds, facets, synapse types or signals here; no code changes needed.
version: 1
kinds:
  - vision
  - domain
  - epic
  - story
  - task
  - impl-fe
  - impl-be
  - impl-integration
  - impl-infra
  - facet
  - concept
facets: [git, cicd, code, data, api, ux, compliance, ops]
lifecycle: [provisional, active, deprecated, obsolete, archived]
status: [planned, in-progress, shipped, blocked]
synapse_types:
  depends_on:
    direction: both
    weight: 0.8
  implements:
    direction: both
    weight: 0.9
  constrains:
    direction: both
    weight: 0.7
  shares_data:
    direction: both
    weight: 0.6
  risks:
    direction: both
    weight: 0.7
  informs:
    direction: forward
    weight: 0.4
  about:
    direction: both
    weight: 0.9
signals: [product-change, code-change, risk, info]
ignition:
  threshold: 0.3
  decay_per_hop: 0.75
  max_hops: 3
  top_k: 8
  token_budget: 1200
  tree_weight: 0.45
  tree_up_weight: 0.3
  memory_decay: 0.5
  refractory_turns: 2
lanes:
  required_for_code_edits: true
  exempt_paths: ["brain/**", ".claude/**", CLAUDE.md, "**/*.md", .gitignore]
  stale_after_days: 30
summary_words:
  summary: 40
  digest: 250
  on_fire: 60
